name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing (OIDC) — no NPM_TOKEN secret is stored. Same setup as evrree-ui.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest && npm --version

      - name: Build
        run: pnpm build

      - name: Dependency-isolation guard
        run: pnpm check-lib-deps

      - name: Browser bundle check
        run: pnpm check-browser

      # Pending changesets: opens/updates a "Version Packages" PR. After that PR merges (no
      # pending changesets), publishes instead. Pinned to v1 to match @changesets/cli ^2, as
      # in evrree-ui (CLI 3 has a bin.js bug on Node 22.3).
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
