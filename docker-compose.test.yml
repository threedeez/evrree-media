# MinIO for `pnpm test:integration`. Start with `pnpm minio:up`, stop with `pnpm minio:down`.
# Pinned to a release tag so CI and laptops test against the same server.
services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    ports:
      - "${MINIO_PORT:-9100}:9000"
    environment:
      MINIO_ROOT_USER: evrree
      MINIO_ROOT_PASSWORD: evrree-secret
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
